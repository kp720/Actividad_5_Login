<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Captura | Sistema Escolar</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/index.css">
    </head>
    <body>

        <div class="d-flex" id="wrapper">

            <!-- Barra lateral -->
            <nav id="sidebar-wrapper">
                <div class="sidebar-heading">Sistema Escolar</div>

                <div class="sidebar-menu">
                    <a href="#submenuUsuarios" class="sidebar-group-toggle" data-bs-toggle="collapse"
                    role="button" aria-expanded="true" aria-controls="submenuUsuarios">Usuarios</a>
                    <div class="collapse show" id="submenuUsuarios">
                        <a href="#" class="sidebar-link active" id="btn-captura" aria-current="page">Captura</a>
                    </div>
                </div>
            </nav>

            <!-- Contenido -->
            <div id="page-content-wrapper">

                <header class="topbar">
                    <button class="btn btn-menu" id="menu-toggle" type="button">Menú</button>

                    <div class="dropdown">
                        <a class="dropdown-toggle user-toggle" href="#" id="nombreUsuarioNavbar" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">Administrador</a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nombreUsuarioNavbar">
                            <li><a class="dropdown-item" href="#">Mi perfil</a></li>
                            <li><a class="dropdown-item" href="#">Configuración</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="login.html" id="btn-cerrar-sesion">Cerrar sesión</a></li>
                        </ul>
                    </div>
                </header>

                <main class="content">
                    <h1 class="page-title">Módulo de captura</h1>

                    <div class="row g-4">

                        <!-- Captura de usuarios -->
                        <div class="col-lg-6">
                            <div class="card">
                                <div class="card-header">Captura de usuario</div>
                                <div class="card-body">
                                    <form id="form-usuarios" novalidate>
                                        <div class="mb-3 campo">
                                            <label for="nombreUsuario" class="form-label">Nombre completo</label>
                                            <input type="text" class="form-control" id="nombreUsuario"
                                                placeholder="Ej. María López" autocomplete="off">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                        </div>

                                        <div class="mb-3 campo">
                                            <label for="correoUsuario" class="form-label">Correo electrónico</label>
                                            <input type="email" class="form-control" id="correoUsuario"
                                                placeholder="nombre@dominio.com" autocomplete="off">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                        </div>

                                        <div class="mb-3 campo">
                                            <label for="telefonoUsuario" class="form-label">Teléfono</label>
                                            <input type="tel" class="form-control" id="telefonoUsuario"
                                                placeholder="10 dígitos" autocomplete="off">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                        </div>

                                        <div class="mb-4 campo">
                                            <label for="passwordUsuario" class="form-label">Contraseña</label>
                                            <input type="password" class="form-control" id="passwordUsuario"
                                                autocomplete="new-password">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                            <div class="form-text">Mínimo 8 caracteres, con mayúscula, minúscula, número y un carácter especial.</div>
                                        </div>

                                        <button type="submit" class="btn btn-accion">Validar usuario</button>
                                    </form>

                                    <div id="resultado-usuario" class="resultado d-none" role="status"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Captura de alumnos -->
                        <div class="col-lg-6">
                            <div class="card">
                                <div class="card-header">Captura de alumno</div>
                                <div class="card-body">
                                    <form id="form-alumnos" novalidate>
                                        <div class="mb-3 campo">
                                            <label for="nombreAlumno" class="form-label">Nombre del alumno</label>
                                            <input type="text" class="form-control" id="nombreAlumno"
                                                placeholder="Ej. Juan Pérez" autocomplete="off">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                        </div>

                                        <div class="mb-3 campo">
                                            <label for="numControl" class="form-label">Número de control</label>
                                            <input type="text" inputmode="numeric" class="form-control" id="numControl"
                                                placeholder="Ej. 22161086" autocomplete="off">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                            <div class="form-text">Exactamente 8 dígitos.</div>
                                        </div>

                                        <div class="mb-4 campo">
                                            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                            <input type="date" class="form-control" id="fechaNacimiento">
                                            <div class="invalid-feedback" aria-live="polite"></div>
                                        </div>

                                        <button type="submit" class="btn btn-accion">Verificar alumno</button>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>
                </main>
            </div>
        </div>

        <!-- Modal de resultado -->
        <div class="modal fade" id="modalEdad" tabindex="-1" aria-labelledby="modalEdadTitulo" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEdadTitulo">Resultado de verificación</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <p class="modal-resumen" id="resumenModalAlumno"></p>
                        <p class="modal-estado" id="mensajeModalEdad"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secundario" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="js/utileria.js"></script>
        <script src="js/index.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/kp720/utileria@main/js/utileria.js"></script>
    </body>
</html>
